[package]
name = "simple-rtsp-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
egui = "0.28"
eframe = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
ffmpeg-next = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17.2"
# Windows 11 Mica backdrop (on Windows 10 and other systems the call simply
# fails and the window uses a solid background).
window-vibrancy = "0.8"
# IPv4 addresses of the network interfaces, to know which subnets to scan.
if-addrs = "0.15"
# System credential vault: only the Windows Credential Manager, without the
# Linux/macOS backends and their dependencies.
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
# Reads the Windows accent color from the registry.
winreg = "0.56"

[dev-dependencies]
proptest = "1"

[profile.release]
# Cross-crate optimization (egui, epaint, tokio...) in the final executable.
lto = "thin"
