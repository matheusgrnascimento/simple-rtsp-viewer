[package]
name = "simple-rtsp-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
egui = "0.28"
eframe = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
ffmpeg-next = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17.2"

[dev-dependencies]
proptest = "1"

[profile.release]
# Cross-crate optimization (egui, epaint, tokio...) in the final executable.
lto = "thin"
